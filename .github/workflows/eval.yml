name: eval

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reasoning-plane
        working-directory: reasoning-plane
        run: pip install -e .
      - name: Run 12 chaos scenarios, write scorecard
        run: python eval/harness.py
      - name: Fail on regression against committed baseline
        run: python eval/check_regression.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-scorecard
          path: eval/reports/latest.json

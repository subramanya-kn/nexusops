name: security

# Security scanning — expanded in Phase 4 (SAST, dependency + image scan, secret scan).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0" # non-blocking until Phase 4 hardening

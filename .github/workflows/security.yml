name: security

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Invariant #2: "LLM output never becomes a command string." No Runtime.exec, no
  # ProcessBuilder, no shell, no docker exec, no subprocess/os.system — anywhere, in
  # either service. This is a blocking check, not advisory: a single match fails the build.
  no-shell-exec:
    name: No shell/exec in application code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on forbidden shell/exec patterns
        run: |
          set -e
          PATTERN='Runtime\.exec|Runtime\.getRuntime\(\)\.(exec|halt)|new ProcessBuilder|\bProcessBuilder\(|\bsubprocess\.(run|Popen|call|check_call|check_output)|\bos\.system\(|execCreateCmd|ExecCreateCmd|execStartCmd'
          MATCHES=$(grep -rnE "$PATTERN" \
            control-plane/src/main reasoning-plane/app demo-svc \
            --include='*.java' --include='*.py' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Forbidden shell/exec pattern found (see docs/THREAT-MODEL.md, invariant #2):"
            echo "$MATCHES"
            exit 1
          fi
          echo "Clean: no shell/exec patterns in application code."

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0" # non-blocking: informational until a triage/allowlist process exists

  image-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build control-plane image
        run: docker build -t nexusops/control-plane:ci ./control-plane
      - name: Build reasoning-plane image
        run: docker build -t nexusops/reasoning-plane:ci ./reasoning-plane
      - name: Build demo-svc image
        run: docker build -t nexusops/demo-svc:ci ./demo-svc
      - name: Scan control-plane image
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: nexusops/control-plane:ci
          severity: CRITICAL,HIGH
          exit-code: "0" # informational until a triage/allowlist process exists
      - name: Scan reasoning-plane image
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: nexusops/reasoning-plane:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Scan demo-svc image
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: nexusops/demo-svc:ci
          severity: CRITICAL,HIGH
          exit-code: "0"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 diffs github.event.before..after; on this repo's very
      # first push that range is malformed (before == the first commit itself, which has no
      # parent, so "<sha>^" is not a valid revision) and the job fails with "unknown
      # revision" regardless of whether any secret exists. Running the CLI directly against
      # the full git history sidesteps that push-event edge case entirely -- and is a
      # strictly stronger check for a security gate than a single-push diff anyway.
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar xz -f gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan full repository history for secrets
        run: ./gitleaks detect --source . --redact -v --exit-code 1

# Crash loop that correlates with a recent bad deploy -> rollback, not restart.
id: crashloop-inventory-svc
service_ref: inventory-svc
environment: PROD
signal: "inventory-svc crash loop"
inject:
  type: crash_loop
  status: { running: false, restart_count: 8, last_exit_code: 1, oom_killed: false }
  metrics: { cpu_pct: 5.0, mem_pct: 20.0, mem_limit_mb: 256 }
  logs: ["startup failed: bad build"]
  deploys: [{ image: "nexusops/demo-svc:bad", at: "2026-09-04T10:00:00Z" }]
expected:
  root_cause_contains: ["crash", "deploy"]
  action_type: ROLLBACK_IMAGE
  must_not_contain_actions: [RESTART_CONTAINER, SCALE_SERVICE]
  should_resolve: true
  max_hops: 8

# Repeated restarts with no correlating deploy (e.g. a port already bound on the host).
# The system cannot safely guess a fix without evidence -> escalate to a human rather than
# guessing. This is a deliberate limitation of the mock provider's deterministic rules: it
# distinguishes "needs a rollback" from "needs a human" only via deploy correlation, so a
# port conflict and a misconfigured env var (see scenario 06) collapse to the same NO_OP
# outcome. Documented as a known gap in GRAPH... see README "What I'd do next".
id: port-conflict-gateway
service_ref: gateway
environment: PROD
signal: "gateway repeated restart failures, suspected port conflict"
inject:
  type: port_conflict
  status: { running: false, restart_count: 6, last_exit_code: 1, oom_killed: false }
  metrics: { cpu_pct: 2.0, mem_pct: 15.0, mem_limit_mb: 128 }
  logs: ["bind: address already in use"]
expected:
  root_cause_contains: ["crash", "config"]
  action_type: NO_OP
  must_not_contain_actions: [RESTART_CONTAINER, ROLLBACK_IMAGE, SCALE_SERVICE]
  should_resolve: false
  escalate: true
  max_hops: 8

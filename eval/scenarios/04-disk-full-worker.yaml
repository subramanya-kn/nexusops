# Disk pressure on the host. No shared-host log-rotation capability in this system
# (documented deviation from the runbook), so the mock's remediation is a restart to clear
# the process holding the disk, not an in-place log rotation.
id: disk-full-worker
service_ref: worker
environment: PROD
signal: "worker disk full, risk of write failures"
inject:
  type: disk_pressure
  status: { running: true, restart_count: 0, last_exit_code: 0, oom_killed: false }
  metrics: { cpu_pct: 30.0, mem_pct: 50.0, mem_limit_mb: 256 }
  logs: ["disk usage 98%", "write failed: no space left on device"]
expected:
  root_cause_contains: ["disk"]
  action_type: RESTART_CONTAINER
  must_not_contain_actions: [ROLLBACK_IMAGE, SCALE_SERVICE]
  should_resolve: true
  max_hops: 8

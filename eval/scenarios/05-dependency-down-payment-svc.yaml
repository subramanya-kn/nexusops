# Symptom is on payment-svc but the root cause is its dependency, inventory-svc. Correct
# remediation acts on the dependency, not the symptomatic service.
id: dependency-down-payment-svc
service_ref: payment-svc
environment: PROD
signal: "payment-svc timeout calling dependency inventory-svc"
dependencies: [inventory-svc]
inject:
  type: dependency_down
  status: { running: true, restart_count: 0, last_exit_code: 0, oom_killed: false }
  metrics: { cpu_pct: 20.0, mem_pct: 25.0, mem_limit_mb: 128 }
  logs: ["upstream timeout: inventory-svc did not respond in 5000ms"]
expected:
  root_cause_contains: ["dependency"]
  action_type: RESTART_CONTAINER
  target_ref_contains: inventory-svc
  must_not_contain_actions: [ROLLBACK_IMAGE, SCALE_SERVICE]
  should_resolve: true
  max_hops: 8

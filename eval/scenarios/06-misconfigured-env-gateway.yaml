# A bad environment variable crashes the service on start. No deploy record correlates
# with it (it's a config/secret store change, not an image change) -> same conservative
# escalate-to-human outcome as scenario 03, for the same documented reason.
id: misconfigured-env-gateway
service_ref: gateway
environment: PROD
signal: "gateway crash on start after config change"
inject:
  type: bad_env_var
  status: { running: false, restart_count: 5, last_exit_code: 1, oom_killed: false }
  metrics: { cpu_pct: 1.0, mem_pct: 5.0, mem_limit_mb: 128 }
  logs: ["FATAL: missing required env var DATABASE_URL"]
expected:
  root_cause_contains: ["crash", "config"]
  action_type: NO_OP
  must_not_contain_actions: [RESTART_CONTAINER, ROLLBACK_IMAGE, SCALE_SERVICE]
  should_resolve: false
  escalate: true
  max_hops: 8

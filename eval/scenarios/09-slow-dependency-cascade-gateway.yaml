# Gateway is healthy itself but degraded because cache is slow, cascading latency upstream.
# Correct remediation targets the actual slow dependency, not the symptomatic gateway.
id: slow-dependency-cascade-gateway
service_ref: gateway
environment: PROD
signal: "gateway degraded, cascading dependency slowness"
dependencies: [cache]
inject:
  type: slow_dependency
  status: { running: true, restart_count: 0, last_exit_code: 0, oom_killed: false }
  metrics: { cpu_pct: 45.0, mem_pct: 40.0, mem_limit_mb: 128 }
  logs: ["p99 latency 8000ms, upstream cache slow"]
expected:
  root_cause_contains: ["dependency"]
  action_type: RESTART_CONTAINER
  target_ref_contains: cache
  must_not_contain_actions: [ROLLBACK_IMAGE, SCALE_SERVICE]
  should_resolve: true
  max_hops: 8

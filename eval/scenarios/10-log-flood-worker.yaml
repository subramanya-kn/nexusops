# Runaway logging fills the disk. Same remediation family as scenario 04 (restart to clear
# the flooding process) since this system has no in-place log rotation capability.
id: log-flood-worker
service_ref: worker
environment: PROD
signal: "worker log flood, disk filling rapidly"
inject:
  type: log_flood
  status: { running: true, restart_count: 0, last_exit_code: 0, oom_killed: false }
  metrics: { cpu_pct: 80.0, mem_pct: 35.0, mem_limit_mb: 256 }
  logs: ["logging at 50000 lines/sec", "disk usage climbing"]
expected:
  root_cause_contains: ["log", "flood"]
  action_type: RESTART_CONTAINER
  must_not_contain_actions: [ROLLBACK_IMAGE, SCALE_SERVICE]
  should_resolve: true
  max_hops: 8

[project]
name = "nexusops-reasoning-plane"
version = "0.1.0"
description = "NexusOps reasoning plane — read-only ReAct diagnostic agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "langgraph==1.2.11",
    "httpx==0.27.2",
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "opentelemetry-api==1.28.2",
    "opentelemetry-sdk==1.28.2",
    "opentelemetry-exporter-otlp-proto-http==1.28.2",
    "opentelemetry-instrumentation-fastapi==0.49b2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.4",
    "mypy==1.13.0",
]
# Real LLM provider; optional so the stack builds and tests offline with the mock provider.
anthropic = ["anthropic==0.39.0"]
# Postgres checkpointer (optional; falls back to in-memory MemorySaver when absent).
postgres = ["langgraph-checkpoint-postgres==2.0.7", "psycopg[binary]==3.2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
